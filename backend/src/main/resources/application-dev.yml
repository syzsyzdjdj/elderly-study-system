# 私有文件位于资源目录之外，不打包；只有 dev 环境加载。
spring:
  config:
    import:
      - optional:file:./config/application-local.yml
      - optional:file:./backend/config/application-local.yml
  flyway:
    baseline-on-migrate: true
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost,capacitor://localhost}
